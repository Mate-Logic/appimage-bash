name: 'AppImage Python'
description: 'Build AppImage packages from tar.gz archives'
author: 'valicm'
branding:
  icon: activity
  color: white
inputs:
  version_url:
    description: 'URL of tar.gz to download'
    required: true
  version_file:
    description: 'File where is stored version string'
    required: true
  version_icon:
    description: 'Name of the app icon'
    required: true
  version_directory:
    description: 'If specific directory is required'
    required: false
  version_bash:
    description: 'Adding regular expression if needed to get version string from version file'
    required: false
  version_check:
    description: 'If the version of the app needs to be checked'
    required: true
    default: 'verify'
  version_only:
    description: 'If we need only version and then stop execution'
    required: true
    default: 'update'
outputs:
  app_update_needed:
    value: ${{ steps.build.outputs.app_update_needed }}
    description: 'Decision if the AppImage needs to be updated'
  app_name:
    value: ${{ steps.build.outputs.app_name }}
    description: 'Application name'
  app_short_name:
    value: ${{ steps.build.outputs.app_short_name }}
    description: 'Application short name'
  app_version:
    value: ${{ steps.build.outputs.app_version }}
    description: 'Built application version'
runs:
  using: "composite"
  steps:
    - id: build
      run: python3 $GITHUB_ACTION_PATH/build.py
      shell: bash
      env:
        INPUT_VERSION_URL: ${{ inputs.version_url }}
        INPUT_VERSION_FILE: ${{ inputs.version_file }}
        INPUT_VERSION_ICON: ${{ inputs.version_icon }}
        INPUT_VERSION_DIRECTORY: ${{ inputs.version_directory }}
        INPUT_VERSION_BASH: ${{ inputs.version_bash }}
        INPUT_VERSION_CHECK: ${{ inputs.version_check }}
        INPUT_VERSION_ONLY: ${{ inputs.version_only }}
